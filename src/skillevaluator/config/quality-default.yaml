# Default deterministic quality-check configuration.
expected_headers:
  - heading: "## Prerequisites"
    alternatives:
      - "## Requirements"
    points: 5
    message: "No prerequisites/requirements documented"
    suggestion: "Document dependencies, API keys, or setup needed"
  - heading: "## Limitations"
    points: 5
    message: "No limitations documented"
    suggestion: "Add '## Limitations' section with known issues/constraints"
  - heading: "## Troubleshooting"
    alternatives:
      - "## Common Issues"
      - "## FAQ"
    points: 5
    message: "No troubleshooting section documented"
    suggestion: "Add '## Troubleshooting' with Error/Cause/Solution patterns"

# Reliability error-handling rules. A custom file may set any subset of these;
# omitted blocks and keys keep the values below. Set points to 0 to turn a rule off.
error_handling:
  # SKILL.md mentions none of the terms (whole word, any case).
  mentioned:
    points: 10
    message: "No mention of error handling or validation"
    suggestion: "Document expected errors and how to handle them"
    terms: [error, errors, exception, exceptions, invalid, fail, fails, failed, failure, failures, failing,
            validate, validates, validated, validating, validation, validations]
  # A script has neither try/except nor any marker (case-sensitive substring).
  scripts:
    points: 5
    message: "Scripts may lack error handling"
    suggestion: "Scripts should handle errors explicitly"
    markers: ["if not ", "if error", "raise", "assert", "ValueError", "FileNotFoundError"]
  # A lib module has neither try/except nor any marker (case-sensitive substring).
  lib:
    points: 5
    message: "Lib modules may lack error handling"
    suggestion: "Library code should handle errors explicitly with try/except or raise"
    markers: ["raise", "assert", "ValueError", "TypeError", "RuntimeError"]

# Efficiency rules. They overlay the same way as error_handling: a custom file may set any
# subset, omitted keys keep the values below, and points: 0 turns a rule off.
efficiency:
  # SKILL.md is estimated at more than max_tokens tokens (characters divided by 4, frontmatter
  # included). The finding appends the estimate and the limit to the message.
  token_budget:
    points: 15
    message: "Large skill. Per agentskills.io, SKILL.md should be concise (~500 lines) — large skill bodies increase token cost after invocation; long or unfocused top-level descriptions can degrade agent routing accuracy"
    suggestion: "Keep required sections concise; move detailed examples, reference material, and supporting docs to the references/ directory"
    max_tokens: 5000

# Discoverability rules. They overlay the same way as error_handling and efficiency. The rules
# from description_too_short to broad_description check the frontmatter description and are
# skipped when the skill has none.
discoverability:
  # The frontmatter description, with surrounding whitespace removed, has fewer than min_chars
  # characters. A skill with no description is not checked here. The finding appends the
  # length and the minimum to the message.
  description_too_short:
    points: 20
    message: "Description too short (recommend 50-150 chars)"
    suggestion: "Add more context: what tasks does this skill handle?"
    min_chars: 20
  # The description, with surrounding whitespace removed, has more than max_chars characters.
  # Checked only when description_too_short does not apply. The finding appends the length and
  # the maximum to the message.
  description_too_long:
    points: 5
    message: "Description very long (recommend 50-150 chars)"
    suggestion: "Keep descriptions concise for progressive disclosure"
    max_chars: 200
  # The description contains none of the terms (whole word or phrase, any case).
  missing_trigger:
    points: 10
    message: "Description doesn't mention WHEN to use this skill"
    suggestion: "Add trigger context: 'Use for...', 'When you need to...'"
    terms: [use, when, for, helps, allows]
  # The description contains one of the terms (whole word or phrase, any case).
  vague_words:
    points: 15
    message: "Description contains vague words"
    suggestion: "Be specific about what this skill does"
    terms: [something, things, stuff, various, general]
  # The description contains one of the terms (whole word or phrase, any case).
  first_or_second_person:
    points: 15
    message: "Description uses first/second person"
    suggestion: "Use third person: 'Processes files' not 'I can process'"
    terms: [i can, i will, you can, you should, your, my, we can]
  # The description has more than over_chars characters, contains one of the terms and none of
  # the negative_terms (whole word or phrase, any case).
  broad_description:
    points: 5
    message: "Broad description without negative triggers may cause over-triggering"
    suggestion: "Add boundary phrases like 'Do NOT use for...'"
    over_chars: 100
    terms: [data, files, documents, project, manage, handle, process]
    negative_terms: [not for, do not use, instead use, except when, not when]
  # SKILL.md does not contain the heading text anywhere (case-sensitive substring). Checked
  # whether or not the skill has a description.
  purpose_section:
    points: 5
    message: "No '## Purpose' section"
    suggestion: "Add purpose section to clarify use cases"
    heading: "## Purpose"
  # The skill directory name has fewer than min_chars characters. The finding appends the name.
  name_too_short:
    points: 10
    message: "Skill name very short"
    suggestion: "Use descriptive names like 'crypto-utils' not 'crypto'"
    min_chars: 5
  # The skill directory name does not start with a lowercase letter followed by lowercase
  # letters, digits, hyphens or underscores. The pattern stays in code. The finding appends the
  # name.
  name_convention:
    points: 10
    message: "Skill name not following convention"
    suggestion: "Use lowercase with hyphens: my-skill-name"

# Correctness rules. They overlay the same way as the sections above.
correctness:
  # The frontmatter name contains one of the terms as a whole word (any case). This is an
  # error-level rule: its finding is HIGH and fails the quality check whatever the score.
  # The finding appends the matched terms to the message. The schema check keeps its own
  # reserved-word list, which this file does not change.
  reserved_name:
    points: 15
    message: "Name contains reserved word"
    suggestion: "Remove reserved words from skill name"
    terms: [anthropic, claude]
